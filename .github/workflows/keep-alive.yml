name: Keep Streamlit Alive

on:
  schedule:
    # Běží každých 12 minut pro spolehlivé udržení aplikace v bdělém stavu
    - cron: '*/12 * * * *'
  workflow_dispatch: # Umožňuje spustit akci i ručně tlačítkem

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ping Streamlit App Main Page (GET with headers)
        run: |
          echo "Sending GET request to main Streamlit app..."
          HTTP_STATUS=$(curl -s -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
            --max-time 45 \
            -o response.html -w "%{http_code}" \
            "https://sklad-asistent.streamlit.app/")
          echo "Status kód hlavní stránky: $HTTP_STATUS"
          if grep -q "wake" response.html 2>/dev/null; then
            echo "Aplikace byla v režimu spánku a byl odeslán požadavek na probuzení."
          fi

      - name: Ping Streamlit Health Endpoint
        run: |
          echo "Sending ping to _stcore/health endpoint..."
          HEALTH_STATUS=$(curl -s -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            --max-time 20 \
            -o /dev/null -w "%{http_code}" \
            "https://sklad-asistent.streamlit.app/_stcore/health")
          echo "Health status: $HEALTH_STATUS"

      - name: Prevent GitHub from suspending cron after 60 days
        run: |
          date -u +"%Y-%m-%d %H:%M:%S UTC" > keep_alive_pulse.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add keep_alive_pulse.txt
          git diff --staged --quiet || git commit -m "chore: keep-alive heartbeat pulse [skip ci]" || true
          git push || echo "Push skipped (no write permission or no changes needed)"
