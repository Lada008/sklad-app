name: Deploy Skladový asistent (GitHub Pages)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python (pro převod sklad.xlsx → data/stock.json)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Aktualizovat data/stock.json ze sklad.xlsx
        run: |
          if [ -f sklad.xlsx ]; then
            python3 scripts/build-stock-json.py sklad.xlsx data/stock.json
          fi

      - name: Připravit čistý balíček pro GitHub Pages
        run: |
          mkdir -p _site
          cp index.html manifest.json sw.js _site/
          cp -r assets css js data _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
